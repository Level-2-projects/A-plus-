<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mock Test Runner – A Plus Dev Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      padding: var(--space-8);
      max-inline-size: 1040px;
      margin-inline: auto;
    }
    .header-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-block-end: var(--space-6);
      flex-wrap: wrap;
      gap: var(--space-4);
    }
    .title-group h1 {
      font-family: var(--font-heading);
      font-size: var(--font-size-32);
      font-weight: 800;
      color: var(--navy-900);
      margin: 0;
    }
    .title-group p {
      color: var(--text-muted);
      margin-block-start: var(--space-1);
    }
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: var(--space-4);
      margin-block-end: var(--space-6);
    }
    .summary-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: var(--space-4);
      box-shadow: var(--shadow-card);
    }
    .summary-label {
      font-size: var(--font-size-12);
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.04em;
    }
    .summary-val {
      font-family: var(--font-heading);
      font-size: var(--font-size-24);
      font-weight: 700;
      margin-block-start: var(--space-1);
      font-variant-numeric: tabular-nums;
    }
    .summary-val--pass { color: var(--success); }
    .summary-val--fail { color: var(--danger); }

    .test-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: var(--space-3);
    }
    .test-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: var(--space-4);
      box-shadow: var(--shadow-card);
      transition: border-color var(--duration-fast);
    }
    .test-item.test-pass {
      border-inline-start: 4px solid var(--success);
    }
    .test-item.test-fail {
      border-inline-start: 4px solid var(--danger);
    }
    .test-header {
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .test-badge {
      font-size: var(--font-size-12);
      font-weight: 700;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .test-pass .test-badge {
      background-color: var(--success);
      color: #ffffff;
    }
    .test-fail .test-badge {
      background-color: var(--danger);
      color: #ffffff;
    }
    .test-meta {
      flex: 1;
    }
    .test-category {
      font-size: var(--font-size-12);
      color: var(--text-muted);
      display: block;
    }
    .test-title {
      font-size: var(--font-size-16);
      font-weight: 600;
      color: var(--navy-900);
      margin: 2px 0 0 0;
    }
    .test-duration {
      font-size: var(--font-size-14);
      color: var(--text-muted);
      font-variant-numeric: tabular-nums;
    }
    .test-error-log {
      margin-block-start: var(--space-3);
      padding: var(--space-3);
      background: #FFF5F5;
      border: 1px solid #FED7D7;
      border-radius: var(--radius-sm);
      color: #C53030;
      font-size: var(--font-size-12);
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .test-running-state {
      padding: var(--space-8);
      text-align: center;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>
  <header class="header-panel">
    <div class="title-group">
      <h1>In-Browser Test Runner</h1>
      <p>Automated verification against the shared localStorage mock API & database</p>
    </div>
    <button id="run-all-btn" class="btn btn-primary" type="button">Run All Scenarios</button>
  </header>

  <section class="summary-grid" aria-label="Test Run Summary">
    <div class="summary-card">
      <span class="summary-label">Passed</span>
      <div id="summary-passed" class="summary-val summary-val--pass">0</div>
    </div>
    <div class="summary-card">
      <span class="summary-label">Failed</span>
      <div id="summary-failed" class="summary-val summary-val--fail">0</div>
    </div>
    <div class="summary-card">
      <span class="summary-label">Total Scenarios</span>
      <div id="summary-total" class="summary-val">0</div>
    </div>
    <div class="summary-card">
      <span class="summary-label">Duration</span>
      <div id="summary-duration" class="summary-val">0ms</div>
    </div>
  </section>

  <main>
    <ul id="test-results-list" class="test-list" aria-live="polite">
      <li class="test-running-state">Click "Run All Scenarios" to start verification...</li>
    </ul>
  </main>

  <script type="module" src="../js/dev/test-runner.js"></script>
</body>
</html>
